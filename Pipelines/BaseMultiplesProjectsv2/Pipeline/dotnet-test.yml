      jobs:
        - job: Test
          steps:
              - task: UseDotNet@2
                displayName: 'Install .NET 6.0'
                inputs:
                  packageType: 'sdk'
                  version: '6.0.x'
                  
              - task: DotNetCoreCLI@2
                displayName: 'Dotnet Test'
                inputs:
                  command: 'test'
                  projects: '$(corepath)'
                  configuration: $(buildConfiguration)